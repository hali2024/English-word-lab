<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lexicon</title>
<style>


:root{
  --paper:#f5f1e8;
  --paper-deep:#ebe4d6;
  --ink:#171716;
  --muted:#777064;
  --line:#d8d0c1;
  --line-dark:#b9af9f;
  --accent:#a54836;
  --accent-soft:#efe0da;
  --navy:#263d56;
  --good:#496b58;
  --good-bg:#e6eee8;
  --bad:#9a4338;
  --bad-bg:#f3e4e1;
  --white:#fbf9f4;
  --shadow:0 18px 50px -35px rgba(34,27,18,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 8%, rgba(165,72,54,.055), transparent 24rem),
    radial-gradient(circle at 88% 22%, rgba(38,61,86,.045), transparent 26rem),
    var(--paper);
  font-family:Georgia,"Times New Roman",serif;
  -webkit-font-smoothing:antialiased;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.045'/%3E%3C/svg%3E");
  mix-blend-mode:multiply;
  z-index:20;
}
::selection{background:var(--ink);color:var(--paper)}
button,input,textarea{font:inherit}
button{
  border:1px solid var(--ink);
  border-radius:6px;
  padding:11px 17px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.02em;
  cursor:pointer;
  background:var(--ink);
  color:var(--paper);
  transition:transform .18s ease,background .18s ease,color .18s ease,border-color .18s ease;
}
button:hover{transform:translateY(-1px);background:var(--accent);border-color:var(--accent)}
button:active{transform:translateY(0)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button.secondary{background:transparent;color:var(--ink);border-color:var(--line-dark)}
button.secondary:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.ghost{background:transparent;color:var(--muted);border-color:transparent;padding:8px 4px;font-weight:700}
button.ghost:hover{background:transparent;color:var(--accent);border-color:transparent}
button:disabled{opacity:.45;cursor:default;transform:none}
.app{width:min(1080px,calc(100% - 40px));margin:auto;padding:42px 0 72px;position:relative;z-index:1}
.top{
  display:grid;
  grid-template-columns:1fr auto;
  gap:30px;
  align-items:end;
  padding:0 0 22px;
  margin-bottom:30px;
  border-bottom:1px solid var(--line-dark);
}
.top:before{
  content:"ENGLISH / MEMORY / PRACTICE";
  display:block;
  grid-column:1/-1;
  font-family:Georgia,"Times New Roman",serif;
  font-size:10px;
  letter-spacing:.16em;
  color:var(--muted);
  margin-bottom:2px;
}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,6vw,66px);font-weight:400;line-height:.95;letter-spacing:-.035em;margin:0}
h1 .accent{color:var(--accent)}
.sub{font-family:Georgia,"Times New Roman",serif;color:var(--muted);font-size:10px;margin-top:13px;letter-spacing:.08em;text-transform:uppercase}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.panel,.quiz,.detail,.interstitial{
  background:rgba(251,249,244,.72);
  border:1px solid var(--line);
  border-radius:3px;
  padding:30px;
  margin-bottom:18px;
  box-shadow:none;
  backdrop-filter:blur(5px);
}
#importPanel{border-top:3px solid var(--ink)}
.panel h2{font-family:Georgia,"Times New Roman",serif;font-size:27px;font-weight:400;letter-spacing:-.02em;margin:0 0 7px!important}
.hint{font-size:12px;color:var(--muted);line-height:1.7}
textarea{
  width:100%;
  min-height:170px;
  border:1px solid var(--line-dark);
  border-radius:2px;
  padding:18px;
  resize:vertical;
  color:var(--ink);
  background:rgba(255,253,248,.72);
  font:14px/1.7 "DM Mono","SFMono-Regular",monospace;
  outline:none;
  transition:border-color .18s,box-shadow .18s;
}
textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,23,22,.06)}
textarea::placeholder{color:#a79f91}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{text-align:left;background:transparent;border:0;border-right:1px solid var(--line);border-radius:0;padding:16px 18px}
.stat:last-child{border-right:0}
.num{font-family:Georgia,"Times New Roman",serif;font-size:31px;font-weight:400;color:var(--ink);line-height:1}
.label{font-family:Georgia,"Times New Roman",serif;font-size:9px;color:var(--muted);margin-top:7px;letter-spacing:.11em;text-transform:uppercase}
.hidden{display:none}
.progress{height:2px;background:var(--paper-deep);overflow:hidden;margin:2px 0 22px}
.bar{height:100%;background:var(--accent);width:0;transition:width .3s ease}
.mode{font-family:Georgia,"Times New Roman",serif;font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:space-between}
.mode small{color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500;font-size:10px}
.wordRow{display:flex;align-items:center;gap:14px;margin:22px 0 8px}
.word{font-family:Georgia,"Times New Roman",serif;font-size:clamp(48px,8vw,86px);font-weight:400;letter-spacing:-.045em;line-height:.95}
.speaker{width:42px;height:42px;border-radius:50%;background:transparent;color:var(--ink);border:1px solid var(--line-dark);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.speaker:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.prompt{font-size:14px;color:var(--muted);margin:5px 0 20px;line-height:1.6}
.options{display:grid;gap:0;border-top:1px solid var(--line)}
.option{
  background:transparent;
  color:var(--ink);
  border:0;
  border-bottom:1px solid var(--line);
  border-radius:0;
  text-align:left;
  padding:18px 8px;
  font-weight:600;
  font-size:14px;
  line-height:1.55;
  position:relative;
}
.option:before{content:"";display:inline-block;width:0;height:1px;background:var(--accent);vertical-align:middle;margin-right:0;transition:width .18s,margin-right .18s}
.option:hover:not(:disabled){background:rgba(165,72,54,.035);border-color:var(--line-dark);transform:none}
.option:hover:not(:disabled):before{width:18px;margin-right:10px}
.option.correct{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.option.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.banner{display:flex;align-items:center;gap:12px;padding:16px 18px;border:1px solid var(--line);border-radius:2px;font-weight:800;font-size:13px;margin-bottom:18px;letter-spacing:.01em}
.banner.good{background:var(--good-bg);color:var(--good)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner .icon{font-size:18px}
.block{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.block h3{font-family:Georgia,"Times New Roman",serif;font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0 0 10px;font-weight:500}
.definition{font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:400;line-height:1.35}
.example{margin-top:9px;color:var(--muted);font-style:italic;font-size:13px;line-height:1.7;padding-left:15px;border-left:1px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:transparent;color:var(--navy);border:1px solid var(--line-dark);padding:6px 10px;border-radius:99px;font-size:11px;font-weight:700}
.chip.empty{border:0;color:var(--muted);font-weight:500;font-style:italic;padding-left:0}
.rootText{font-size:13px;line-height:1.75;color:var(--ink);background:rgba(235,228,214,.5);padding:14px;border-left:2px solid var(--accent);border-radius:0}
.dictBox{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 0 8px}
.dictBox .speaker{width:68px;height:68px;font-size:26px;margin-bottom:18px}
.dictInput{width:100%;max-width:360px;text-align:center;font:700 21px/1.3 "DM Mono",monospace;padding:14px;border-radius:2px;border:1px solid var(--line-dark);background:transparent;letter-spacing:.04em;color:var(--ink)}
.dictInput:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,23,22,.06)}
.dictInput.correct{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.dictInput.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.centerRow{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.interstitial{text-align:center;padding:48px 30px}
.bigEmoji{font-size:38px;margin-bottom:8px;filter:grayscale(.2)}
.interstitial h2{font-family:Georgia,"Times New Roman",serif;margin:6px 0 10px;font-size:34px;font-weight:400}
.interstitial p{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 14px}
.footer{font-family:Georgia,"Times New Roman",serif;font-size:9px;color:var(--muted);text-align:center;margin-top:30px;line-height:1.7;letter-spacing:.04em}
@media(max-width:700px){
  .app{width:min(100% - 24px,1080px);padding:25px 0 52px}
  .top{grid-template-columns:1fr;gap:18px;align-items:start}
  .top .row{margin-top:0}
  .panel,.quiz,.detail,.interstitial{padding:22px}
  .stats{grid-template-columns:1fr}
  .stat{border-right:0;border-bottom:1px solid var(--line);padding:13px 15px}
  .stat:last-child{border-bottom:0}
  .word{font-size:48px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* --- classical edition --- */
:root{
  --paper:#f3ecdd;--paper-deep:#e6dac5;--ink:#2b2723;--muted:#75695c;
  --line:rgba(74,55,39,.20);--line-dark:rgba(74,55,39,.38);
  --accent:#71343b;--accent-soft:#eee1dc;--navy:#4d5860;
  --good:#71343b;--good-bg:#eee1dc;--bad:#5e5148;--bad-bg:#e9e1d5;
  --white:#fbf7ed;--shadow:0 24px 65px rgba(52,38,24,.13)
}
body{background:radial-gradient(circle at 14% 9%,rgba(255,255,255,.55),transparent 25rem),radial-gradient(circle at 88% 72%,rgba(255,255,255,.28),transparent 28rem),linear-gradient(135deg,#ded2bf,#d6c9b5 50%,#e2d7c5);}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,rgba(50,35,20,.08) 0,rgba(50,35,20,.08) 1px,transparent 1px,transparent 4px);z-index:30}
.app{width:min(900px,calc(100% - 36px));padding:42px 0 68px}
.top{display:block;text-align:center;border-bottom:0;padding:0;margin-bottom:34px}
.top:before{content:"";display:none}
h1{font-size:clamp(44px,7vw,72px);font-weight:400;letter-spacing:.01em;line-height:1;color:var(--accent)}
h1 .accent{color:inherit}
.sub{font-family:Georgia,"Times New Roman",serif;color:var(--muted);font-size:15px;margin-top:12px;letter-spacing:.02em;text-transform:none;font-style:italic}
.top:after{content:"✦";display:block;color:#aa8a5b;font-size:14px;margin:19px auto 0}
.top .row{justify-content:center;margin-top:15px}
button{border-radius:2px;font-family:Georgia,"Times New Roman",serif;font-size:13px;font-weight:500;letter-spacing:.04em;background:var(--accent);border-color:var(--accent)}
button:hover{background:#54262c;border-color:#54262c}
button.secondary{background:transparent;color:var(--accent);border-color:rgba(113,52,59,.4)}
button.secondary:hover{background:rgba(113,52,59,.07);color:var(--accent);border-color:var(--accent)}
button.ghost{font-size:12px}
.panel,.quiz,.detail,.interstitial{background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.06)),rgba(251,247,237,.82);border:1px solid var(--line);border-radius:2px;box-shadow:var(--shadow);padding:32px}
.panel:before,.quiz:before,.detail:before,.interstitial:before{content:"";position:absolute;inset:8px;border:1px solid rgba(170,138,91,.20);pointer-events:none}
.panel h2{font-size:27px;font-weight:400;color:#54262c;letter-spacing:.01em}
.hint{font-family:Georgia,"Times New Roman",serif;font-size:13px;color:var(--muted)}
textarea{font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.7;background:rgba(255,252,245,.55);border-color:var(--line-dark)}
.stats{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent}
.stat{background:rgba(243,236,221,.65);border-right:1px solid var(--line)}
.num{font-family:Georgia,"Times New Roman",serif;font-size:31px;color:var(--accent);font-weight:400}
.label{font-family:Georgia,"Times New Roman",serif;font-size:10px;letter-spacing:.17em}
.mode{font-family:Georgia,"Times New Roman",serif;color:var(--accent);letter-spacing:.18em;font-weight:600}
.mode small{font-family:Georgia,"Times New Roman",serif;font-style:italic}
.word{font-family:Georgia,"Times New Roman",serif;font-size:clamp(50px,8vw,82px);font-weight:400;color:#54262c;letter-spacing:-.02em}
.speaker{font-family:Georgia,"Times New Roman",serif;color:var(--accent);border-color:rgba(113,52,59,.4);background:transparent}
.speaker:hover{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.prompt{display:none}
.options{border-top:1px solid var(--line)}
.option{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:15px;background:transparent;border-bottom:1px solid var(--line);padding:18px 10px}
.option.correct,.option.wrong{background:transparent;color:var(--ink);border-color:var(--line)}
.option.correct:before,.option.wrong:before{width:18px;margin-right:10px;background:var(--accent)}
.banner{font-family:Georgia,"Times New Roman",serif;background:transparent!important;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:2px 0 15px;color:var(--accent)!important;font-size:18px;font-weight:400;font-style:italic}
.banner .icon{display:none}
.banner.bad{color:var(--muted)!important}
.block{border-top:1px solid var(--line)}
.block h3{font-family:Georgia,"Times New Roman",serif;font-size:10px;letter-spacing:.18em;font-weight:600;color:#9a7b4e}
.definition{font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:400;line-height:1.5}
.examples{display:grid;gap:12px}
.example{font-family:Georgia,"Times New Roman",serif;font-size:14px}
.rootText{background:rgba(230,218,197,.40);font-family:Georgia,"Times New Roman",serif}
.chip{font-family:Georgia,"Times New Roman",serif;color:var(--accent);font-weight:400}
.dictInput{font-family:Georgia,"Times New Roman",serif;font-weight:400;background:transparent;border-color:var(--line-dark)}
.dictInput:focus{box-shadow:none;border-color:var(--accent)}
.interstitial{padding:52px 30px}
.bigEmoji{display:none}
.interstitial h2{font-family:Georgia,"Times New Roman",serif;font-size:36px;font-weight:400;color:#54262c}
.interstitial p{font-family:Georgia,"Times New Roman",serif}
.results{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);max-width:560px;margin:28px auto 12px;border:1px solid var(--line)}
.result{background:rgba(255,252,245,.55);padding:20px}
.result .value{font-family:Georgia,"Times New Roman",serif;font-size:42px;font-weight:400;color:var(--accent)}
.result .name{font-family:Georgia,"Times New Roman",serif;font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:7px}
.result .note{font-family:Georgia,"Times New Roman",serif;font-size:12px;color:var(--muted);font-style:italic;margin-top:6px}
.footer{font-family:Georgia,"Times New Roman",serif;font-size:10px;letter-spacing:.12em;color:var(--muted);text-align:center;margin-top:28px}
@media(max-width:700px){.app{width:min(100% - 24px,900px);padding:28px 0 52px}.panel,.quiz,.detail,.interstitial{padding:23px 18px}.word{font-size:48px}.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}.results{grid-template-columns:1fr}}

</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>The Lexicon</h1>
    <div class="sub">A private study of language</div>
  </div>

  <section id="importPanel" class="panel">
    <h2 style="margin-top:0;font-size:17px">The Word Studio</h2>
    <p class="hint">Enter the words you wish to study.</p>
    <textarea id="aiWordsInput" style="min-height:130px;font-family:inherit" placeholder="seek
find
become"></textarea>
    <div class="row">
      <button id="generateAIButton" onclick="generateWithAI()">Compose Library</button>
    </div>
    <p id="aiStatus" class="hint" style="margin-bottom:0"></p>
  </section>

  <section class="panel">
    <h2 style="margin-top:0;font-size:17px">From a CSV</h2>
    <p class="hint">Paste your CSV here</p>
    <textarea id="csvInput" placeholder="word,definition,example,synonyms,antonyms,root_analysis,cognates
"></textarea>
    <div class="row">
      <button onclick="loadCSV()">Load Library</button>
      <button class="secondary" onclick="downloadTemplate()">Download CSV Template</button>
      <button class="ghost" onclick="clearLibrary()">Clear Library & Progress</button>
    </div>
  </section>

  <div id="appArea" class="hidden">
    <div class="stats" id="statsRow"></div>
    <div id="stage"></div>
  </div>

  <div class="footer">The Lexicon · Developed by H.H</div>
</div>

<script>
const KEY='englishWordLab_v2';
const TTS_SUPPORTED = 'speechSynthesis' in window;
let state=null;

function freshState(words){
  return {
    words, phase:'recognition', screen:'question',
    activeIds: words.map((_,i)=>i),
    roundQueue:[], roundPos:0, wrongThisRound:[], roundNumber:1, masteredIds:[],
    dictQueue:[], current:null, locked:false,
    stats:{recAttempts:0, recCorrect:0, dictAttempts:0, dictCorrect:0}
  };
}

function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function uniq(a){return [...new Set(a)];}

function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function loadState(){
  try{const x=JSON.parse(localStorage.getItem(KEY)); if(x&&Array.isArray(x.words)&&x.words.length) state=x;}catch(e){}
  if(state){document.getElementById('appArea').classList.remove('hidden'); document.getElementById('importPanel').classList.add('hidden'); render();}
}

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1];
    if(c=='"'){if(q&&n=='"'){cell+='"';i++;}else q=!q;}
    else if(c==','&&!q){row.push(cell.trim());cell='';}
    else if((c=='\n'||c=='\r')&&!q){if(c=='\r'&&n=='\n')i++;row.push(cell.trim());cell='';if(row.some(Boolean))rows.push(row);row=[];}
    else cell+=c;
  }
  row.push(cell.trim());if(row.some(Boolean))rows.push(row);
  if(!rows.length)return [];
  const header=rows[0].map(x=>x.toLowerCase().trim());
  const idx=name=>header.indexOf(name);
  let wi=idx('word'), di=idx('definition'), ei=idx('example'), e1=idx('example1'), e2=idx('example2'), e3=idx('example3'), exs=idx('examples'),
      si=idx('synonyms'), ai=idx('antonyms'),
      ri=idx('root_analysis')>=0?idx('root_analysis'):idx('root'),
      ci=idx('cognates');
  let dataRows;
  const hasHeader = wi>=0 && di>=0;
  if(!hasHeader){ wi=0;di=1;ei=2;si=3;ai=4;ri=5;ci=6; dataRows=rows; }
  else { dataRows=rows.slice(1); }
  const splitMulti=s=> s? s.split(';').map(x=>x.trim()).filter(Boolean) : [];
  return dataRows.map(r=>{
    let examples=[];
    if(e1>=0||e2>=0||e3>=0){[e1,e2,e3].forEach(i=>{if(i>=0&&(r[i]||'').trim())examples.push((r[i]||'').trim());});}
    else if(exs>=0) examples=splitMulti(r[exs]||'');
    else if(ei>=0&&(r[ei]||'').trim()) examples=[(r[ei]||'').trim()];
    return {
      word:(r[wi]||'').trim(),
      definition:(r[di]||'').trim(),
      example:examples[0]||'', examples,
      synonyms:si>=0?splitMulti(r[si]):[],
      antonyms:ai>=0?splitMulti(r[ai]):[],
      root:ri>=0?(r[ri]||'').trim():'',
      cognates:ci>=0?splitMulti(r[ci]):[]
    };
  }).filter(x=>x.word&&x.definition);
}
function loadCSV(){
  const words=parseCSV(document.getElementById('csvInput').value);
  if(!words.length){alert('No valid words found. Please check your CSV format.');return;}
  state=freshState(words);
  document.getElementById('appArea').classList.remove('hidden');
  document.getElementById('importPanel').classList.add('hidden');
  beginRecognitionRound();
  loadRecognitionQuestion();
  save(); render();
}

async function generateWithAI(){
  const input=document.getElementById('aiWordsInput');
  const button=document.getElementById('generateAIButton');
  const status=document.getElementById('aiStatus');

  const words=[...new Set(
    input.value
      .split(/[\n,，;；]+/)
      .map(x=>x.trim())
      .filter(Boolean)
  )];

  if(!words.length){
    status.textContent='Please enter at least one English word.';
    return;
  }

  if(words.length>50){
    status.textContent='Please enter no more than 50 words at a time.';
    return;
  }

  button.disabled=true;
  status.textContent=`Generating ${words.length} word${words.length===1?'':'s'} with DeepSeek…`;

  try{
    const response=await fetch('/api/generate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({words})
    });

    let data={};
    try{
      data=await response.json();
    }catch(e){
      throw new Error('Server returned an invalid response.');
    }

    if(!response.ok){
      throw new Error(data.error || `Request failed (${response.status})`);
    }

    if(!data.words || !Array.isArray(data.words) || !data.words.length){
      throw new Error('DeepSeek returned no valid vocabulary.');
    }

    const normalized=data.words
      .map(w=>{
        const examples=Array.isArray(w.examples)
          ? w.examples.map(String).map(x=>x.trim()).filter(Boolean).slice(0,3)
          : (w.example ? [String(w.example).trim()] : []);
        return {
          word:String(w.word||'').trim(),
          definition:String(w.definition||'').trim(),
          example:examples[0]||'',
          examples,
          synonyms:Array.isArray(w.synonyms)?w.synonyms.map(String).map(x=>x.trim()).filter(Boolean):[],
          antonyms:Array.isArray(w.antonyms)?w.antonyms.map(String).map(x=>x.trim()).filter(Boolean):[],
          root:String(w.root||'').trim(),
          cognates:Array.isArray(w.cognates)?w.cognates.map(String).map(x=>x.trim()).filter(Boolean):[]
        };
      })
      .filter(w=>w.word && w.definition);

    if(!normalized.length){
      throw new Error('DeepSeek returned words without usable definitions.');
    }

    state=freshState(normalized);
    document.getElementById('appArea').classList.remove('hidden');
    document.getElementById('importPanel').classList.add('hidden');
    beginRecognitionRound();
    loadRecognitionQuestion();
    save();
    render();

  }catch(error){
    console.error('AI generation failed:',error);
    status.textContent=`${error.message}`;
  }finally{
    button.disabled=false;
  }
}
function clearLibrary(){if(confirm('Clear the library and all progress?')){localStorage.removeItem(KEY);location.reload();}}
function toggleImport(){document.getElementById('importPanel').classList.toggle('hidden');}
function downloadTemplate(){
  const text='word,definition,example1,example2,example3,synonyms,antonyms,root_analysis,cognates\n'+
    'meticulous,very careful about small details,She is meticulous about her work.,His meticulous notes revealed every small error.,A meticulous eye can turn routine work into craft.,careful;thorough;precise,careless;sloppy,"From Latin meticulosus, meaning fearful or overly cautious, from metus meaning fear; developed into the sense of being extremely careful",meticulousness;meticulously\n';

  const blob=new Blob([text],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='word_library_template.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------- speech ---------- */
let speechVoices = [];

function loadSpeechVoices(){
  if(!TTS_SUPPORTED) return;
  speechVoices = window.speechSynthesis.getVoices();
}

if(TTS_SUPPORTED){
  loadSpeechVoices();
  window.speechSynthesis.onvoiceschanged = loadSpeechVoices;
}

function speak(text){
  if(!TTS_SUPPORTED || !text) return;

  try{
    const synth = window.speechSynthesis;
    synth.cancel();

    const u = new SpeechSynthesisUtterance(String(text));

    const voices = speechVoices.length ? speechVoices : synth.getVoices();
    const englishVoice =
      voices.find(v => /^en-US$/i.test(v.lang)) ||
      voices.find(v => /^en-/i.test(v.lang)) ||
      voices.find(v => /English/i.test(v.name));

    if(englishVoice){
      u.voice = englishVoice;
      u.lang = englishVoice.lang;
    }else{
      u.lang = 'en-US';
    }

    u.rate = 0.92;
    u.pitch = 1;
    u.volume = 1;

    synth.speak(u);
  }catch(e){
    console.warn('Speech synthesis failed:', e);
  }
}

function speakerBtn(word,size){
  if(!TTS_SUPPORTED) return '';
  const safeWord = String(word)
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/\r?\n/g,' ');
  return `<button type="button" class="speaker" title="Play pronunciation" onclick="event.stopPropagation();speak('${safeWord}')"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M4 9v6h4l5 4V5L8 9H4"></path><path d="M16 9.5c1 .8 1.5 1.6 1.5 2.5s-.5 1.7-1.5 2.5"></path><path d="M18.5 7c1.7 1.4 2.5 3 2.5 5s-.8 3.6-2.5 5"></path></svg></button>`;
}

/* ---------- recognition phase ---------- */
function beginRecognitionRound(){
  state.roundQueue=shuffle(state.activeIds);
  state.roundPos=0;
  state.wrongThisRound=[];
}
function buildDefinitionOptions(id){
  const correct=state.words[id];
  const pool=state.words
    .map((w,i)=>({w,i}))
    .filter(o=>o.i!==id && o.w.definition!==correct.definition);
  const distractors=shuffle(pool).slice(0,3).map(o=>({text:o.w.definition,isCorrect:false}));
  const opts=shuffle([{text:correct.definition,isCorrect:true},...distractors]);
  return opts;
}
function loadRecognitionQuestion(){
  const id=state.roundQueue[state.roundPos];
  state.current={id, options:buildDefinitionOptions(id), answered:false, selected:null, correct:null};
  state.locked=false;
  state.screen='question';
}
function renderQuestionScreen(){
  const w=state.words[state.current.id];
  const roundNote = state.roundNumber>1 ? `<small>Round ${state.roundNumber} · Reviewing ${state.roundQueue.length} words</small>` : `<small>${state.words.length} words total</small>`;
  const optsHtml=state.current.options.map((o,i)=>
    `<button type="button" class="option" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${escapeHTML(o.text)}</button>`
  ).join('');
  setTimeout(()=>speak(w.word),150);
  return `
  <section class="quiz">
    <div class="mode">Recognition ${roundNote}</div>
    <div class="progress"><div class="bar" style="width:${(state.roundPos/state.roundQueue.length*100)}%"></div></div>
    <div class="wordRow"><div class="word">${escapeHTML(w.word)}</div>${speakerBtn(w.word)}</div>
    <div class="options">${optsHtml}</div>
  </section>`;
}
function selectAnswer(i){
  if(state.locked) return;
  state.locked=true;
  const opt=state.current.options[i];
  state.current.answered=true;
  state.current.selected=i;
  state.current.correct=opt.isCorrect;
  state.stats.recAttempts++;
  if(opt.isCorrect){
    state.stats.recCorrect++;
    state.masteredIds = uniq([...state.masteredIds, state.current.id]);
  } else {
    state.wrongThisRound.push(state.current.id);
  }
  state.screen='detail';
  save(); render();
}
function renderDetailScreen(){
  const w=state.words[state.current.id];
  const correct=state.current.correct;
  const banner=correct?`<div class="banner good">Well remembered.</div>`:`<div class="banner bad">Worth another look.</div>`;
  const chips=(arr)=>arr&&arr.length?`<div class="chips">${arr.map(x=>`<span class="chip">${escapeHTML(x)}</span>`).join('')}</div>`:`<div class="chips"><span class="chip empty">None recorded</span></div>`;
  const examples=w.examples&&w.examples.length?w.examples:(w.example?[w.example]:[]);
  return `
  <section class="detail">
    ${banner}
    <div class="wordRow">${speakerBtn(w.word)}<div class="word" style="font-size:31px">${escapeHTML(w.word)}</div></div>
    <div class="block"><h3>Definition</h3><div class="definition">${escapeHTML(w.definition)}</div></div>
    ${examples.length?`<div class="block"><h3>Examples</h3><div class="examples">${examples.slice(0,3).map(x=>`<div class="example">${escapeHTML(x)}</div>`).join('')}</div></div>`:''}
    <div class="block"><h3>Synonyms</h3>${chips(w.synonyms)}</div>
    <div class="block"><h3>Antonyms</h3>${chips(w.antonyms)}</div>
    <div class="block"><h3>Root Analysis</h3><div class="rootText">${w.root?escapeHTML(w.root):'None recorded'}</div></div>
    <div class="block"><h3>Cognates</h3>${chips(w.cognates)}</div>
    <div class="centerRow"><button onclick="continueFromDetail()">Continue</button></div>
  </section>`;
}
function continueFromDetail(){
  state.locked=false;
  state.roundPos++;
  if(state.roundPos<state.roundQueue.length){
    loadRecognitionQuestion();
  } else {
    if(state.wrongThisRound.length===0){
      state.screen='phaseTransition';
    } else {
      state.activeIds = uniq(state.wrongThisRound);
      state.screen='roundTransition';
    }
  }
  save(); render();
}
function renderRoundTransition(){
  return `
  <section class="interstitial">
    <div class="bigEmoji"></div>
    <h2>Round ${state.roundNumber} Complete</h2>
    <p>${state.masteredIds.length} words are securely remembered. <b>${state.activeIds.length}</b> remain for another reading.</p>
    <div class="centerRow"><button onclick="advanceRound()">Begin Round ${state.roundNumber+1}</button></div>
  </section>`;
}
function advanceRound(){
  state.roundNumber++;
  beginRecognitionRound();
  loadRecognitionQuestion();
  save(); render();
}
function renderPhaseTransition(){
  return `
  <section class="interstitial">
    <div class="bigEmoji"></div>
    <h2>Recognition Complete</h2>
    <p>Every word has been remembered in the latest round. The spelling test follows.</p>
    <div class="centerRow"><button onclick="startDictationPhase()">Begin Spelling Test</button></div>
  </section>`;
}

/* ---------- dictation phase ---------- */
function startDictationPhase(){
  state.phase='dictation';
  state.dictQueue=shuffle(state.words.map((_,i)=>i));
  loadDictQuestion();
  save(); render();
}
function loadDictQuestion(){
  if(state.dictQueue.length===0){
    state.phase='done'; state.screen='complete'; return;
  }
  const id=state.dictQueue[0];
  state.current={id, checked:false, correct:null, inputVal:''};
  state.locked=false;
  state.screen='dictQuestion';
}
function renderDictQuestionScreen(){
  const w=state.words[state.current.id];
  const remaining=uniq(state.dictQueue).length;
  setTimeout(()=>speak(w.word),150);
  return `
  <section class="quiz">
    <div class="mode">Spelling <small>${remaining} remaining</small></div>
    <div class="dictBox">
      <button type="button" class="speaker" title="Play pronunciation" onclick="speak('${String(w.word).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' ')}')"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M4 9v6h4l5 4V5L8 9H4"></path><path d="M16 9.5c1 .8 1.5 1.6 1.5 2.5s-.5 1.7-1.5 2.5"></path><path d="M18.5 7c1.7 1.4 2.5 3 2.5 5s-.8 3.6-2.5 5"></path></svg></button>
      <input class="dictInput" id="dictInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Write what you hear" onkeydown="if(event.key==='Enter')checkDictation()">
      <div class="centerRow">
        <button class="secondary" type="button" onclick="speak('${String(w.word).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' ')}')"> Replay</button>
        <button type="button" onclick="checkDictation()">Submit</button>
      </div>
    </div>
  </section>`;
}
function focusDictInput(){
  const el=document.getElementById('dictInput');
  if(el) el.focus();
}
function checkDictation(){
  if(state.locked) return;
  const el=document.getElementById('dictInput');
  const val=(el?el.value:'').trim();
  if(!val) return;
  state.locked=true;
  const w=state.words[state.current.id];
  const correct = val.toLowerCase()===w.word.toLowerCase();
  state.stats.dictAttempts++;
  if(correct) state.stats.dictCorrect++;
  state.current.checked=true;
  state.current.correct=correct;
  state.current.inputVal=val;
  state.dictQueue.shift();
  if(!correct) state.dictQueue.push(state.current.id);
  state.screen='dictFeedback';
  save(); render();
}
function renderDictFeedbackScreen(){
  const w=state.words[state.current.id];
  const correct=state.current.correct;
  const banner=correct
    ? `<div class="banner good">Well spelled.</div>`
    : `<div class="banner bad">Not yet. The word returns to the end of the queue.</div>`;
  return `
  <section class="detail">
    ${banner}
    <div class="wordRow">${speakerBtn(w.word)}<div class="word" style="font-size:30px">${escapeHTML(w.word)}</div></div>
    <div class="block"><h3>Your Spelling</h3><div class="definition" style="color:${correct?'var(--good)':'var(--bad)'}">${escapeHTML(state.current.inputVal)}</div></div>
    <div class="block"><h3>Definition</h3><div class="definition">${escapeHTML(w.definition)}</div></div>
    <div class="centerRow"><button onclick="continueDictation()">Continue</button></div>
  </section>`;
}
function continueDictation(){
  loadDictQuestion();
  save(); render();
}

/* ---------- complete ---------- */
function renderComplete(){
  const rec=state.stats.recAttempts? Math.round(state.stats.recCorrect/state.stats.recAttempts*100):0;
  const dict=state.stats.dictAttempts? Math.round(state.stats.dictCorrect/state.stats.dictAttempts*100):0;
  return `
  <section class="interstitial">
    <div class="bigEmoji"></div>
    <h2>Complete</h2>
    <p>You have finished this study of ${state.words.length} words.</p>
    <div class="results">
      <div class="result"><div class="value">${rec}%</div><div class="name">Recognition</div><div class="note">${state.roundNumber} round${state.roundNumber===1?'':'s'}</div></div>
      <div class="result"><div class="value">${dict}%</div><div class="name">Spelling</div><div class="note">${state.stats.dictAttempts} attempts</div></div>
    </div>
    <div class="centerRow">
      <button onclick="restartSameLibrary()">Study Again</button>
      <button class="secondary" onclick="clearLibrary()">Import New Library</button>
    </div>
  </section>`;
}
function restartSameLibrary(){
  const words=state.words;
  state=freshState(words);
  beginRecognitionRound();
  loadRecognitionQuestion();
  save(); render();
}

/* ---------- stats + dispatcher ---------- */
function renderStats(){
  let total=state.words.length, v2=0, l2='Mastered', v3='0%', l3='Accuracy';
  if(state.phase==='recognition'){
    v2=state.masteredIds.length;
    v3=state.stats.recAttempts?Math.round(state.stats.recCorrect/state.stats.recAttempts*100)+'%':'0%';
  } else if(state.phase==='dictation'){
    l2='Completed';
    v2=total-uniq(state.dictQueue).length;
    v3=state.stats.dictAttempts?Math.round(state.stats.dictCorrect/state.stats.dictAttempts*100)+'%':'0%';
  } else {
    v2=total; v3='100%';
  }
  return `
  <div class="stat"><div class="num">${total}</div><div class="label">Total Words</div></div>
  <div class="stat"><div class="num">${v2}</div><div class="label">${l2}</div></div>
  <div class="stat"><div class="num">${v3}</div><div class="label">${l3}</div></div>`;
}
function render(){
  document.getElementById('statsRow').innerHTML=renderStats();
  const stage=document.getElementById('stage');
  switch(state.screen){
    case 'question': stage.innerHTML=renderQuestionScreen(); break;
    case 'detail': stage.innerHTML=renderDetailScreen(); break;
    case 'roundTransition': stage.innerHTML=renderRoundTransition(); break;
    case 'phaseTransition': stage.innerHTML=renderPhaseTransition(); break;
    case 'dictQuestion': stage.innerHTML=renderDictQuestionScreen(); focusDictInput(); break;
    case 'dictFeedback': stage.innerHTML=renderDictFeedbackScreen(); break;
    case 'complete': stage.innerHTML=renderComplete(); break;
    default: stage.innerHTML='';
  }
}

loadState();
</script>
